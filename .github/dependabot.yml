# Dependabot keeps the third-party GitHub Actions used by CI up to date, as pull requests
# that must pass CI before they can be merged. (PriceWatch itself has no Python dependencies.)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
