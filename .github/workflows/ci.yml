name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"          # the Python built into macOS; newest runners no longer ship it
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # GitHub's Ubuntu runners ship Google Chrome, so the browser-fallback tests run too
      - run: python -m unittest discover -s tests -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # scan full history, not just the last commit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Stdlib secret scanner
        run: python scripts/check_secrets.py
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
