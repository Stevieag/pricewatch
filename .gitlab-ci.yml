stages:
  - test
  - secrets

# GitLab's built-in secret detection (gitleaks-based) on every pipeline
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secrets
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "true"   # scan full history, not just the last commit

unit-tests:
  stage: test
  image: python:3.12-slim
  script:
    - python -m unittest discover -s tests -v

secret-scan-stdlib:
  stage: secrets
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - python scripts/check_secrets.py
