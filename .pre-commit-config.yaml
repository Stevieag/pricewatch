# Install once:  pip install pre-commit && pre-commit install
# Or without pre-commit:  ln -s ../../scripts/pre-commit-hook.sh .git/hooks/pre-commit
repos:
  - repo: local
    hooks:
      - id: pricewatch-secret-scan
        name: PriceWatch secret scan (stdlib)
        entry: python scripts/check_secrets.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: gitleaks (if installed)
        entry: sh -c 'command -v gitleaks >/dev/null 2>&1 && gitleaks protect --staged --redact --no-banner || echo "gitleaks not installed - skipped (CI still runs it)"'
        language: system
        pass_filenames: false
        always_run: true
