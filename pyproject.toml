[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricewatch"
version = "0.1.0"
description = "Self-hosted, local-first price monitor with AI price search and fair-price checks"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = []   # standard library only - by design

classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Stevieag/pricewatch"
Issues = "https://github.com/Stevieag/pricewatch/issues"

[project.scripts]
pricewatch = "pricewatch.__main__:main"

[tool.setuptools.packages.find]
include = ["pricewatch*"]

[tool.setuptools.package-data]
pricewatch = ["static/*"]
